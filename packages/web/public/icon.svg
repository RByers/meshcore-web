<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MeshCore Web">
  <title>MeshCore Web</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1673e0"/>
      <stop offset="1" stop-color="#0a4fa3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- radio waves from the top node -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="18" opacity="0.85">
    <path d="M206 132a70 70 0 0 1 100 0"/>
    <path d="M178 104a110 110 0 0 1 156 0" opacity="0.6"/>
  </g>
  <!-- mesh links -->
  <g stroke="#cfe4ff" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="190" x2="146" y2="330"/>
    <line x1="256" y1="190" x2="366" y2="330"/>
    <line x1="146" y1="330" x2="366" y2="330"/>
    <line x1="256" y1="190" x2="256" y2="400"/>
    <line x1="146" y1="330" x2="256" y2="400"/>
    <line x1="366" y1="330" x2="256" y2="400"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#0b63c9" stroke-width="10">
    <circle cx="256" cy="190" r="36"/>
    <circle cx="146" cy="330" r="30"/>
    <circle cx="366" cy="330" r="30"/>
    <circle cx="256" cy="400" r="30"/>
  </g>
  <circle cx="256" cy="190" r="13" fill="#0b63c9"/>
</svg>
