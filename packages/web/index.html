<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="MeshCore companion radio client for the browser: messaging, channels, map, packet inspector and node admin over USB or Bluetooth." />
    <meta name="theme-color" data-scheme="light" content="#0b63c9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" data-scheme="dark" content="#1b1f25" media="(prefers-color-scheme: dark)" />
    <title>MeshCore Web</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icon-maskable-192.png" />
    <meta name="apple-mobile-web-app-title" content="MeshCore Web" />
    <style>
      :root {
        color-scheme: light dark;
      }
      /* the themed background fills the whole window, including areas under system bars
         (viewport-fit=cover); the shell pads its own UI with env(safe-area-inset-*) */
      /* The document never scrolls: mc-app is exactly the viewport and its <main> is the only page
         scroller. A non-scrolling root also keeps Android Chrome's top controls from collapsing
         (dvh still follows them if they do), and overscroll-behavior stops pull-to-refresh from
         reloading the page (and dropping the radio connection). */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: light-dark(#f6f7f9, #111418);
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <mc-app></mc-app>
  </body>
</html>
